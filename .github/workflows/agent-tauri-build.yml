name: agent-tauri-build

on:
  push:
    branches: [main]
    paths:
      - 'agent-tauri/**'
      - 'agent/**'
      - '.github/workflows/agent-tauri-build.yml'
  pull_request:
    paths:
      - 'agent-tauri/**'
      - 'agent/**'
      - '.github/workflows/agent-tauri-build.yml'
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies (webkit2gtk etc.)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: agent-tauri/src-tauri

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: agent-tauri/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: agent-tauri

      - name: Rust unit tests (protocol + config)
        run: cargo test
        working-directory: agent-tauri/src-tauri

      - name: Rust release build (compile check)
        run: cargo build --release
        working-directory: agent-tauri/src-tauri

      - name: Bundle installers (tauri build)
        run: npm run tauri build
        working-directory: agent-tauri

      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: lemniscate-agent-${{ matrix.os }}
          path: |
            agent-tauri/src-tauri/target/release/bundle/**
          if-no-files-found: warn

  release:
    name: Publish agent-latest release
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout (for the CLI agent zip)
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/

      # Zip the Node CLI agent (agent/) so the web UI can offer it as a
      # standalone download: lemniscate-agent-cli.zip.
      - name: Zip the CLI agent folder
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          cd agent
          zip -r ../out/lemniscate-agent-cli.zip . -x 'node_modules/*'
          cd ..
          ls -la out/lemniscate-agent-cli.zip

      - name: Normalize installer names
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          dmg=$(find dist -type f -name '*.dmg' | head -n 1)
          msi=$(find dist -type f -name '*.msi' | head -n 1)
          nsis=$(find dist -type f -name '*-setup.exe' | head -n 1)
          appimage=$(find dist -type f -name '*.AppImage' | head -n 1)
          deb=$(find dist -type f -name '*.deb' | head -n 1)

          if [ -z "$dmg" ]; then
            echo '::error::macOS .dmg missing from build artifacts'
            exit 1
          fi
          cp "$dmg" out/lemniscate-agent-macos.dmg

          if [ -n "$msi" ]; then
            cp "$msi" out/lemniscate-agent-windows.msi
          elif [ -n "$nsis" ]; then
            cp "$nsis" out/lemniscate-agent-windows-setup.exe
          else
            echo '::error::Windows installer (.msi or nsis .exe) missing from build artifacts'
            exit 1
          fi

          if [ -n "$appimage" ]; then
            cp "$appimage" out/lemniscate-agent-linux.AppImage
          else
            echo '::warning::Linux .AppImage missing from build artifacts'
          fi
          if [ -n "$deb" ]; then
            cp "$deb" out/lemniscate-agent-linux.deb
          else
            echo '::warning::Linux .deb missing from build artifacts'
          fi
          ls -la out/

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: agent-latest
          name: Lemniscate Agent (latest)
          prerelease: true
          files: out/*
