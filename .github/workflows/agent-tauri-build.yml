name: agent-tauri-build

on:
  push:
    branches: [main]
    paths:
      - 'agent-tauri/**'
      - 'agent/**'
      - 'tests/contract/device-ws/**'
      - '.github/workflows/agent-tauri-build.yml'
  pull_request:
    paths:
      - 'agent-tauri/**'
      - 'agent/**'
      - 'tests/contract/device-ws/**'
      - '.github/workflows/agent-tauri-build.yml'
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.os }}-${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            arch: arm64
          # amd64 mac is cross-compiled on the arm64 runner: macos-13 (the
          # only free Intel mac) is capacity-starved and stalled the release.
          - os: macos-latest
            arch: amd64
            target: x86_64-apple-darwin
          - os: windows-latest
            arch: amd64
          - os: windows-11-arm
            arch: arm64
          - os: ubuntu-latest
            arch: amd64
          - os: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies (webkit2gtk etc.)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Add cross-compile target
        if: matrix.target
        run: rustup target add ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: agent-tauri/src-tauri

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: agent-tauri/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: agent-tauri

      - name: Module size guard (max 300 lines per AGENTS.md)
        run: npm run check:max-lines
        working-directory: agent-tauri

      - name: Rust unit tests (protocol + config)
        run: cargo test
        working-directory: agent-tauri/src-tauri

      - name: Rust release build (compile check)
        run: cargo build --release
        working-directory: agent-tauri/src-tauri

      - name: Bundle installers (tauri build)
        run: npm run tauri build -- ${{ matrix.target && format('--target {0}', matrix.target) || '' }}
        working-directory: agent-tauri

      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: lemniscate-agent-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            agent-tauri/src-tauri/target/release/bundle/**
            agent-tauri/src-tauri/target/*/release/bundle/**
          if-no-files-found: warn

  release:
    name: Publish agent-latest release
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout (for the CLI agent zip)
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/

      # Zip the Node CLI agent (agent/) so the web UI can offer it as a
      # standalone download: lemniscate-agent-cli.zip.
      - name: Zip the CLI agent folder
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          cd agent
          zip -r ../out/lemniscate-agent-cli.zip . -x 'node_modules/*'
          cd ..
          ls -la out/lemniscate-agent-cli.zip

      - name: Normalize installer names
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out

          # Artifact dirs match the build matrix:
          #   lemniscate-agent-macos-latest-arm64, lemniscate-agent-macos-latest-amd64,
          #   lemniscate-agent-windows-latest-amd64, lemniscate-agent-windows-11-arm-arm64,
          #   lemniscate-agent-ubuntu-latest-amd64, lemniscate-agent-ubuntu-24.04-arm-arm64
          macos_arm64=dist/lemniscate-agent-macos-latest-arm64
          macos_amd64=dist/lemniscate-agent-macos-latest-amd64
          windows_amd64=dist/lemniscate-agent-windows-latest-amd64
          windows_arm64=dist/lemniscate-agent-windows-11-arm-arm64
          linux_amd64=dist/lemniscate-agent-ubuntu-latest-amd64
          linux_arm64=dist/lemniscate-agent-ubuntu-24.04-arm-arm64

          copy_dmg() {
            local dir=$1 name=$2
            local dmg
            dmg=$(find "$dir" -type f -name '*.dmg' | head -n 1)
            if [ -z "$dmg" ]; then
              echo "::error::macOS $name .dmg missing from build artifacts"
              exit 1
            fi
            cp "$dmg" "out/lemniscate-agent-macos-$name.dmg"
          }

          copy_windows() {
            local dir=$1 name=$2
            local msi nsis
            msi=$(find "$dir" -type f -name '*.msi' | head -n 1)
            nsis=$(find "$dir" -type f -name '*-setup.exe' | head -n 1)
            if [ -n "$msi" ]; then
              cp "$msi" "out/lemniscate-agent-windows-$name.msi"
            elif [ -n "$nsis" ]; then
              cp "$nsis" "out/lemniscate-agent-windows-$name-setup.exe"
            else
              echo "::error::Windows $name installer (.msi or nsis .exe) missing from build artifacts"
              exit 1
            fi
          }

          copy_linux() {
            local dir=$1 name=$2
            local appimage deb
            appimage=$(find "$dir" -type f -name '*.AppImage' | head -n 1)
            deb=$(find "$dir" -type f -name '*.deb' | head -n 1)
            if [ -n "$appimage" ]; then
              cp "$appimage" "out/lemniscate-agent-linux-$name.AppImage"
            else
              echo "::warning::Linux $name .AppImage missing from build artifacts"
            fi
            if [ -n "$deb" ]; then
              cp "$deb" "out/lemniscate-agent-linux-$name.deb"
            else
              echo "::warning::Linux $name .deb missing from build artifacts"
            fi
          }

          copy_dmg "$macos_arm64" arm64
          copy_dmg "$macos_amd64" amd64
          copy_windows "$windows_amd64" amd64
          copy_windows "$windows_arm64" arm64
          copy_linux "$linux_amd64" amd64
          copy_linux "$linux_arm64" arm64
          ls -la out/

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: agent-latest
          name: Lemniscate Agent (latest)
          prerelease: true
          files: out/*
