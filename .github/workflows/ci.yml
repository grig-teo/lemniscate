name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend — build & test (Node 24.18.0)
    runs-on: ubuntu-latest
    env:
      # Dummy URL: prisma validate/generate require the env var to exist, and
      # vitest.config.ts overrides it for tests. No database is contacted —
      # backend tests mock Prisma/Redis (see backend/vitest.config.ts).
      DATABASE_URL: postgresql://test:test@localhost:5432/test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Validate Prisma schema
        working-directory: backend
        run: npx prisma validate

      - name: Generate Prisma client
        working-directory: backend
        run: npx prisma generate

      - name: Build (tsc strict)
        working-directory: backend
        run: npm run build

      - name: Test (vitest)
        working-directory: backend
        run: npm test

      - name: Module size guard (max 300 lines per AGENTS.md)
        working-directory: backend
        run: npm run check:max-lines

      - name: Shared script tests (check-max-lines)
        run: node --test scripts/check-max-lines.test.mjs

      # Guards the shared device-WS protocol contract: verifies that
      # tests/contract/device-ws/index.json matches the directory and every
      # fixture has the required structure. Consumer test suites
      # (backend, agent, agent-tauri) iterate this index, so an unlisted or
      # malformed fixture is invisible to CI without this check.
      - name: Device-WS contract fixture lint
        run: node tests/contract/device-ws/lint.js

  frontend:
    name: Frontend — build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build (tsc --noEmit && vite build)
        working-directory: frontend
        run: npm run build

      - name: Test (vitest)
        working-directory: frontend
        run: npm test

      - name: Module size guard (max 300 lines per AGENTS.md)
        working-directory: frontend
        run: npm run check:max-lines

  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      android: ${{ steps.filter.outputs.android }}
      ios: ${{ steps.filter.outputs.ios }}
      e2e: ${{ steps.filter.outputs.e2e }}
      backend: ${{ steps.filter.outputs.backend }}
      agent: ${{ steps.filter.outputs.agent }}
    steps:
      - uses: actions/checkout@v4

      # Works for both pull_request and push events; compares against the
      # PR base or the push's before-commit respectively.
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            android:
              - 'android/**'
              - 'tests/contract/**'
              - '.github/workflows/ci.yml'
            ios:
              - 'ios/**'
              - 'tests/contract/**'
              - '.github/workflows/ci.yml'
            e2e:
              - 'backend/**'
              - 'frontend/**'
              - 'docker-compose.yml'
              - 'tests/e2e/**'
              - '.github/workflows/ci.yml'
            backend:
              - 'backend/**'
              - '.github/workflows/ci.yml'
            agent:
              - 'agent/**'
              - 'scripts/check-max-lines.mjs'
              - 'tests/contract/device-ws/**'
              - '.github/workflows/ci.yml'

  agent:
    name: Agent — test & size guard
    needs: changes
    if: needs.changes.outputs.agent == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: agent/package-lock.json

      - name: Install dependencies
        working-directory: agent
        run: npm ci

      - name: Test (node --test)
        working-directory: agent
        run: npm test

      - name: Module size guard (max 300 lines per AGENTS.md)
        working-directory: agent
        run: npm run check:max-lines

  android:
    name: Android — test, lint & assembleDebug
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        working-directory: android
        run: ./gradlew testDebugUnitTest

      # Blocking since 2026-07: pre-existing findings are captured in
      # android/app/lint-baseline.xml; any NEW finding fails the job.
      - name: Lint
        working-directory: android
        run: ./gradlew lint

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

  # Real-Postgres integration tests (backend/tests/*.integration.test.ts,
  # gated on INTEGRATION=1 — skipped in the unit-test job above). Proves the
  # proposal auto-start claim race-safety against a live database: mocked
  # transactions cannot catch a missing pg_advisory_xact_lock.
  integration:
    name: Backend — Postgres integration tests
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      INTEGRATION: '1'
      # vitest.config.ts defers to this when set (its inline env otherwise
      # overrides process.env).
      DATABASE_URL: postgresql://test:test@localhost:5432/test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Apply migrations
        working-directory: backend
        run: npx prisma migrate deploy

      - name: Run integration tests
        working-directory: backend
        run: npx vitest run tests/proposal-claim.integration.test.ts

  e2e:
    name: E2E — agent pipeline on the real compose stack (Gitea + mock LLM)
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # run.sh boots docker-compose.yml + tests/e2e/docker-compose.e2e.yml,
      # waits on /health/ready for backend and worker, seeds a throwaway
      # Gitea (user + token + repo) and one DB user/connection, then drives
      # the core value chain through the real API: PAT connect -> repo sync
      # -> LLM config -> task run (clone/LLM/commit/push) -> asserted
      # pull-request creation on Gitea, plus /api/usage, notification and
      # Prometheus /metrics assertions.
      - name: Run e2e smoke suite
        run: ./tests/e2e/run.sh

      # run.sh dumps backend/worker/gitea/gitstub (and all other service)
      # logs to tests/e2e/artifacts/ on failure — keep them for debugging.
      - name: Upload service logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-service-logs
          path: tests/e2e/artifacts/
          if-no-files-found: warn
          retention-days: 14

  ios:
    name: iOS — xcodebuild (simulator)
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen

      # `test` needs a concrete simulator (generic destinations only build).
      # Select by UDID from simctl rather than by name from -showdestinations:
      # a name-only destination implies OS:latest, which fails when the picked
      # iPhone exists only on an older runtime (e.g. first-listed iPhone is
      # not installed on the newest runtime). id= avoids name/runtime
      # mismatches on any runner image.
      - name: Build & test on iOS Simulator (no signing)
        working-directory: ios
        run: |
          SIM_UDID=$(xcrun simctl list devices available -j | python3 -c '
            import json, sys
            data = json.load(sys.stdin)
            for runtime in sorted(data["devices"], reverse=True):
                for d in data["devices"][runtime]:
                    if d.get("isAvailable") and "iPhone" in d["name"]:
                        print(d["udid"]); sys.exit(0)
            sys.exit("no available iPhone simulator found")
          ')
          echo "Using simulator UDID: $SIM_UDID"
          xcodebuild -project Lemniscate.xcodeproj -scheme Lemniscate \
            -destination "platform=iOS Simulator,id=$SIM_UDID" \
            CODE_SIGNING_ALLOWED=NO test
