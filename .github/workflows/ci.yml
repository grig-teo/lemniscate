name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend — build & test (Node 24.18.0)
    runs-on: ubuntu-latest
    env:
      # Dummy URL: prisma validate/generate require the env var to exist, and
      # vitest.config.ts overrides it for tests. No database is contacted —
      # backend tests mock Prisma/Redis (see backend/vitest.config.ts).
      DATABASE_URL: postgresql://test:test@localhost:5432/test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Validate Prisma schema
        working-directory: backend
        run: npx prisma validate

      - name: Generate Prisma client
        working-directory: backend
        run: npx prisma generate

      - name: Build (tsc strict)
        working-directory: backend
        run: npm run build

      - name: Test (vitest)
        working-directory: backend
        run: npm test

  frontend:
    name: Frontend — build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build (tsc --noEmit && vite build)
        working-directory: frontend
        run: npm run build

      - name: Test (vitest)
        working-directory: frontend
        run: npm test

      - name: Module size guard (max 300 lines per AGENTS.md)
        working-directory: frontend
        run: npm run check:max-lines

  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      android: ${{ steps.filter.outputs.android }}
      ios: ${{ steps.filter.outputs.ios }}
    steps:
      - uses: actions/checkout@v4

      # Works for both pull_request and push events; compares against the
      # PR base or the push's before-commit respectively.
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            android:
              - 'android/**'
              - '.github/workflows/ci.yml'
            ios:
              - 'ios/**'
              - '.github/workflows/ci.yml'

  android:
    name: Android — assembleDebug
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Lint (non-blocking for now)
        working-directory: android
        continue-on-error: true
        run: ./gradlew lint

  ios:
    name: iOS — xcodebuild (simulator)
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen

      - name: Build for iOS Simulator (no signing)
        working-directory: ios
        run: >-
          xcodebuild -project Lemniscate.xcodeproj -scheme Lemniscate
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO build
