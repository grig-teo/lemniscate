# TLS edge for the e2e git stub. Two server blocks share one self-signed
# cert (SANs: gitstub, api.gitstub) — the backend/worker trust it via
# NODE_TLS_REJECT_UNAUTHORIZED=0 / GIT_SSL_NO_VERIFY=true, which the e2e
# compose override sets (throwaway network, no real certs needed).
#
#   https://gitstub/...      -> git smart HTTP (git-http-backend via fcgiwrap)
#   https://api.gitstub/...  -> the stub provider API (stub-server.mjs :8080)

server {
    listen 443 ssl;
    server_name gitstub;

    ssl_certificate     /etc/ssl/gitstub/gitstub.crt;
    ssl_certificate_key /etc/ssl/gitstub/gitstub.key;

    # git-http-backend serves every repo under /srv/git (GIT_HTTP_EXPORT_ALL
    # removes the need for git-daemon-export-ok marker files).
    location / {
        fastcgi_pass unix:/run/fcgiwrap.sock;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME   /usr/libexec/git-core/git-http-backend;
        fastcgi_param GIT_PROJECT_ROOT  /srv/git;
        fastcgi_param GIT_HTTP_EXPORT_ALL "";
        fastcgi_param PATH_INFO         $uri;
        fastcgi_param REMOTE_USER       e2e;
        # Receive-pack bodies are small here, but never buffer a push.
        client_max_body_size 64m;
        proxy_request_buffering off;
    }
}

server {
    listen 443 ssl;
    server_name api.gitstub;

    ssl_certificate     /etc/ssl/gitstub/gitstub.crt;
    ssl_certificate_key /etc/ssl/gitstub/gitstub.key;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
    }
}
