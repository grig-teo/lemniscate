# TLS edge in front of the e2e Gitea container. Two server blocks share one
# self-signed cert (SANs: gitstub, api.gitstub) — the backend/worker trust it
# via NODE_TLS_REJECT_UNAUTHORIZED=0 / GIT_SSL_NO_VERIFY=true, which the e2e
# compose override sets (throwaway network, no real certs needed).
#
#   https://gitstub/...      -> Gitea web + git smart HTTP (gitea:3000)
#   https://api.gitstub/...  -> the Gitea API (gitea:3000/api/v1)
#
# Why the api. vhost exists: the backend's GitVerse provider client derives
# the REST base as https://api.<host> of the connection's baseUrl
# (gitverseApiBase in backend/src/lib/git-providers/gitverse.ts) and calls
# unprefixed paths (/user, /user/repos, /repos/:full/pulls). The rewrite to
# Gitea's /api/v1 prefix happens here, so the worker exercises the REAL
# provider code path against a REAL git server.
#
# Both vhosts force `Host: gitstub` + `X-Forwarded-Proto: https`: Gitea 1.26
# builds clone_url/html_url from the request host and proto, and the suite
# asserts those URLs point back at this TLS edge.

server {
    listen 443 ssl;
    server_name gitstub;

    ssl_certificate     /etc/ssl/gitstub/gitstub.crt;
    ssl_certificate_key /etc/ssl/gitstub/gitstub.key;

    location / {
        proxy_pass http://gitea:3000;
        proxy_set_header Host gitstub;
        proxy_set_header X-Forwarded-Proto https;
        # Receive-pack bodies are small here, but never buffer a push.
        client_max_body_size 64m;
        proxy_request_buffering off;
    }
}

server {
    listen 443 ssl;
    server_name api.gitstub;

    ssl_certificate     /etc/ssl/gitstub/gitstub.crt;
    ssl_certificate_key /etc/ssl/gitstub/gitstub.key;

    location / {
        proxy_pass http://gitea:3000/api/v1/;
        proxy_set_header Host gitstub;
        proxy_set_header X-Forwarded-Proto https;
    }
}
