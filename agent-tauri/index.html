<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lemniscate Connect</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main class="panel">
      <svg class="logo" viewBox="0 0 24 24" width="72" height="72" fill="none" aria-hidden="true">
        <path
          class="logo-base"
          d="M12 12c-2-2.67-4-4-6-4a4 4 0 1 0 0 8c2 0 4-1.33 6-4Zm0 0c2 2.67 4 4 6 4a4 4 0 0 0 0-8c-2 0-4 1.33-6 4Z"
        />
        <path
          class="logo-pulse"
          pathLength="100"
          d="M12 12c-2-2.67-4-4-6-4a4 4 0 1 0 0 8c2 0 4-1.33 6-4Zm0 0c2 2.67 4 4 6 4a4 4 0 0 0 0-8c-2 0-4 1.33-6 4Z"
        />
      </svg>
      <h1>Lemniscate Connect</h1>
      <p id="status" class="status">Status: starting…</p>

      <form id="pair-form">
        <label>
          Server URL
          <input id="server" type="url" placeholder="https://lemniscate.example.com" required />
        </label>
        <label>
          Pairing code
          <input id="code" type="text" placeholder="ABC123" minlength="6" maxlength="6" required />
        </label>
        <label>
          Device name
          <input id="name" type="text" placeholder="My Mac" />
        </label>
        <button id="pair-button" type="submit">Pair &amp; connect</button>
      </form>

      <p id="paired-note" class="note" hidden>
        This device is paired. The tunnel runs in the background; you can close this window.
      </p>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
