name: Lemniscate
options:
  bundleIdPrefix: space.grigteo
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
targets:
  Lemniscate:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Lemniscate
    configFiles:
      Debug: Base.xcconfig
      Release: Base.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: space.grigteo.lemniscate
        INFOPLIST_FILE: Lemniscate/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
  LemniscateTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: LemniscateTests
      # Shared API-contract fixtures (also decoded by the Android contract
      # tests); bundled as test resources, loaded via Bundle.url(forResource:).
      # READMEs are excluded: tests/contract/README.md and
      # device-ws/README.md would both copy to the same resources path
      # ("Multiple commands produce .../README.md").
      - path: ../tests/contract
        buildPhase: resources
        excludes:
          - README.md
          - "**/README.md"
    dependencies:
      - target: Lemniscate
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: space.grigteo.lemniscate.tests
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Lemniscate.app/Lemniscate
        BUNDLE_LOADER: $(TEST_HOST)
schemes:
  Lemniscate:
    build:
      targets:
        Lemniscate: all
        LemniscateTests: [test]
    test:
      targets:
        - LemniscateTests
